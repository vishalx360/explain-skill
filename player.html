<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explainer</title>
<!--LIBS-->
<style>
:root{
  --bg:#0e1116; --panel:#141922; --line:#222a37; --ink:#e6edf6; --dim:#8b97a8;
  --accent:#6ea8fe; --accent-ink:#08101f; --lit:#1d2a3f; --litbar:#6ea8fe;
  --toc-on:#1a2130; --edge-bg:#0e1116; --error:#ffa198; --error-bg:#2a1618;
  --error-line:#5c2b2f; --spot:rgba(9,12,17,.62);
  --syntax-red:#ff7b72; --syntax-blue:#a5d6ff; --syntax-comment:#8b949e;
  --syntax-cyan:#79c0ff; --syntax-purple:#d2a8ff; --syntax-orange:#ffa657;
  --shadow:0 18px 50px rgba(0,0,0,.32); --overlay:rgba(3,7,18,.66);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f7f9fc; --panel:#ffffff; --line:#dce2ea; --ink:#172033; --dim:#667085;
  --accent:#2563eb; --accent-ink:#ffffff; --lit:#e8f0ff; --litbar:#2563eb;
  --toc-on:#edf3ff; --edge-bg:#f7f9fc; --error:#9f1239; --error-bg:#fff1f2;
  --error-line:#fecdd3; --spot:rgba(23,32,51,.42);
  --syntax-red:#cf222e; --syntax-blue:#0a3069; --syntax-comment:#6e7781;
  --syntax-cyan:#0550ae; --syntax-purple:#8250df; --syntax-orange:#953800;
  --shadow:0 18px 50px rgba(23,32,51,.16); --overlay:rgba(23,32,51,.28);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}

#app{display:flex;height:100vh}

#toc{width:288px;flex:0 0 288px;background:var(--panel);border-right:1px solid var(--line);
     overflow:hidden;display:flex;flex-direction:column;transition:width .22s ease,
     flex-basis .22s ease,opacity .16s ease,transform .22s ease}
#app.toc-hidden #toc{width:0;flex-basis:0;opacity:0;transform:translateX(-16px);
  overflow:hidden;border-right:0;padding-left:0;padding-right:0;pointer-events:none}
.sidehead{height:68px;flex:0 0 68px;padding:0 14px 0 20px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .eyebrow{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.brand strong{font-size:15px;font-weight:600;letter-spacing:-.01em}
#toclist{padding:10px;overflow-y:auto;flex:1}
.toc-item{padding:10px 12px;font-size:13.5px;line-height:1.35;color:var(--dim);cursor:pointer;
  border-radius:8px;border:1px solid transparent;margin:2px 0;transition:color .15s,background .15s;
  display:block;width:100%;text-align:left;background:transparent;font-family:var(--sans)}
.toc-item:hover{color:var(--ink);background:var(--toc-on)}
.toc-item.on{color:var(--ink);border-color:var(--line);background:var(--toc-on)}
.toc-item .n{font-family:var(--mono);font-size:11px;opacity:.55;margin-right:8px}

main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#topbar{position:absolute;top:14px;left:20px;right:20px;z-index:6;display:flex;
  align-items:center;pointer-events:none}
#topbar>*{pointer-events:auto}
.toolbar{margin-left:auto;display:flex;align-items:center;gap:4px;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;padding:4px;box-shadow:var(--shadow)}
.iconbtn,.menubtn{border:0;background:transparent;color:var(--dim);height:34px;min-width:34px;
  border-radius:8px;font:500 13px var(--sans);cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;gap:8px;padding:0 9px;transition:color .15s,background .15s,opacity .18s}
.iconbtn:hover,.menubtn:hover{color:var(--ink);background:var(--toc-on)}
.iconbtn:focus-visible,.menubtn:focus-visible,#ctl button:focus-visible,#start:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.menubtn{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:0 12px}
#app:not(.toc-hidden) #menubtn{opacity:0;visibility:hidden;transform:translateX(-8px)}
#stage{flex:1;overflow:auto;padding:86px clamp(28px,4vw,72px) 24px;display:flex;flex-direction:column}
#stage>*{width:min(100%,1280px);margin-left:auto;margin-right:auto}
h2.title{font-size:30px;line-height:1.2;margin:0 0 6px;font-weight:600;letter-spacing:-.01em}
.subtitle{font-family:var(--mono);font-size:12.5px;color:var(--dim);margin:0 0 26px}

ul.bullets{list-style:none;padding:0;margin:8px 0;font-size:19px;line-height:1.6}
ul.bullets li{padding:8px 0 8px 26px;position:relative;opacity:.32;transition:opacity .35s}
ul.bullets li::before{content:"";position:absolute;left:4px;top:19px;width:7px;height:7px;
  border-radius:50%;background:var(--dim)}
ul.bullets li.seen{opacity:.5}
ul.bullets li.on{opacity:1}
ul.bullets li.on::before{background:var(--accent);box-shadow:0 0 0 4px rgba(110,168,254,.16)}

pre.code{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  overflow:auto;font-family:var(--mono);font-size:14px;line-height:1.65;padding:14px 0}
pre.code .row{display:flex;padding:0 16px;opacity:.38;transition:opacity .3s,background .3s;
  border-left:2px solid transparent}
pre.code .row.on{opacity:1;background:var(--lit);border-left-color:var(--litbar)}
pre.code .gut{flex:0 0 auto;width:34px;text-align:right;margin-right:16px;color:var(--dim);
  opacity:.6;user-select:none}
pre.code .src{white-space:pre;flex:1}

.hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-section{color:var(--syntax-red)}
.hljs-string,.hljs-regexp,.hljs-addition{color:var(--syntax-blue)}
.hljs-comment,.hljs-quote{color:var(--syntax-comment);font-style:italic}
.hljs-number,.hljs-symbol,.hljs-attr,.hljs-property,.hljs-variable.language_{color:var(--syntax-cyan)}
.hljs-title,.hljs-title.function_,.hljs-title.class_{color:var(--syntax-purple)}
.hljs-built_in,.hljs-type,.hljs-params,.hljs-attribute{color:var(--syntax-orange)}
.hljs-meta,.hljs-doctag{color:var(--syntax-comment)}
.hljs-deletion{color:var(--error)}

.mermaid-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.mermaid-wrap svg{width:100%;height:100%;max-width:100%!important}
.mermaid-wrap .node{opacity:.35;transition:opacity .35s}
.mermaid-wrap .node.on{opacity:1}
.mermaid-wrap .node.on rect,.mermaid-wrap .node.on circle,.mermaid-wrap .node.on polygon,
.mermaid-wrap .node.on path{stroke:var(--accent)!important;stroke-width:2.5px!important}
.mermaid-wrap.nolit .node{opacity:1}
.mermaid-wrap .edgePath{opacity:.55}
.mermaid-wrap .edgeLabel{opacity:.85}
.mermaid-wrap .edgeLabel rect,.mermaid-wrap .edgeLabel .labelBkg{fill:var(--edge-bg)!important;
  background-color:var(--edge-bg)!important;opacity:1!important}
.mermaid-wrap .edgeLabel foreignObject div{background:var(--edge-bg)!important;padding:0 5px}

.mermaid-wrap{flex-direction:column;gap:14px}
.mmerr{color:var(--error);background:var(--error-bg);border:1px solid var(--error-line);border-radius:8px;
  padding:11px 14px;font-family:var(--mono);font-size:13px;align-self:stretch}

.shot{position:relative;align-self:flex-start;max-width:100%}
.shot img{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.spot{position:absolute;border:2px solid var(--accent);border-radius:6px;
  box-shadow:0 0 0 9999px var(--spot);transition:all .4s}

#say{flex:0 0 auto;padding:17px clamp(28px,4vw,72px) 13px;font-size:15.5px;line-height:1.5;
  color:var(--dim);border-top:1px solid var(--line);min-height:64px;background:var(--panel)}
#say b{color:var(--ink);font-weight:400;display:block;max-width:1280px;margin:auto}

#bar{height:3px;background:var(--line)}
#fill{height:100%;width:0;background:var(--accent);transition:width .2s linear}

#ctl{flex:0 0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:10px clamp(28px,4vw,72px) 16px;font-size:12px;color:var(--dim);
  font-family:var(--mono);background:var(--panel)}
#ctl button{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;
  min-width:38px;height:34px;padding:0 11px;font:inherit;cursor:pointer}
#ctl button:hover{color:var(--ink);border-color:var(--dim);background:var(--toc-on)}
#ctl button[aria-pressed="true"]{color:var(--ink);border-color:var(--accent);background:var(--lit)}
.transport{display:flex;align-items:center;gap:6px;justify-self:center}
.transport [data-act="play"]{min-width:74px;color:var(--accent);border-color:var(--accent)}
#pos{justify-self:start}
#rate{justify-self:end}

#help{width:min(440px,calc(100vw - 32px));background:var(--panel);color:var(--ink);
  border:1px solid var(--line);border-radius:16px;padding:0;box-shadow:var(--shadow)}
#help::backdrop{background:var(--overlay);backdrop-filter:blur(3px)}
.helphead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;
  border-bottom:1px solid var(--line)}
.helphead h3{font-size:17px;margin:0;letter-spacing:-.01em}
.helpbody{padding:18px 20px 22px}
.helpbody p{margin:0 0 16px;color:var(--dim);font-size:13.5px;line-height:1.5}
.shortcut-grid{display:grid;grid-template-columns:1fr auto;gap:10px 20px;align-items:center;
  font-size:13.5px}
.shortcut-grid span{color:var(--dim)}
kbd{font:500 12px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:6px;padding:4px 7px;min-width:34px;text-align:center}

#cover{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:22px;z-index:9;text-align:center;padding:32px}
#cover h1{font-size:36px;font-weight:600;margin:0;max-width:24ch;line-height:1.2}
#cover p{color:var(--dim);margin:0;font-family:var(--mono);font-size:13px}
#cover button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;
  padding:13px 30px;font:600 15px var(--sans);cursor:pointer}
#cover button:disabled{opacity:.45;cursor:not-allowed}
#cover.gone{display:none}

@media (max-width:760px){
  #toc{position:fixed;inset:0 auto 0 0;z-index:7;box-shadow:12px 0 32px rgba(0,0,0,.2)}
  #stage{padding:76px 24px 16px}
  #say{padding:14px 24px 10px}
  #ctl{padding:10px 24px 14px;grid-template-columns:auto 1fr auto}
  .transport{justify-self:center}
  .toolbar{box-shadow:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="app">
  <aside id="toc" aria-label="slide navigation">
    <div class="sidehead">
      <div class="brand"><span class="eyebrow">Explainer</span><strong>Slides</strong></div>
      <button class="iconbtn" data-act="toc" id="tocbtn" title="collapse slides" aria-label="collapse slides">&#8249;</button>
    </div>
    <div id="toclist"></div>
  </aside>
  <main>
    <div id="topbar">
      <button class="menubtn" data-act="toc" id="menubtn" title="show slides" aria-label="show slides">
        <span aria-hidden="true">&#9776;</span><span>Slides</span>
      </button>
      <div class="toolbar" aria-label="display controls">
        <button class="iconbtn" data-act="theme" id="themebtn" title="switch color theme" aria-label="switch color theme">&#9728;</button>
        <button class="iconbtn" data-act="help" id="helpbtn" title="keyboard shortcuts" aria-label="keyboard shortcuts">?</button>
        <button class="iconbtn" data-act="fullscreen" id="fullscreenbtn" title="enter full screen" aria-label="enter full screen">&#9974;</button>
      </div>
    </div>
    <div id="stage"></div>
    <div id="say"></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="ctl">
      <span id="pos"></span>
      <div class="transport">
        <button data-act="prev" title="previous step" aria-label="previous step">&larr;</button>
        <button data-act="play">pause</button>
        <button data-act="next" title="next step" aria-label="next step">&rarr;</button>
      </div>
      <button data-act="rate" id="rate" title="playback speed" aria-label="change playback speed">1&times;</button>
    </div>
  </main>
</div>

<dialog id="help" aria-labelledby="help-title">
  <div class="helphead">
    <h3 id="help-title">Keyboard shortcuts</h3>
    <button class="iconbtn" data-act="close-help" aria-label="close keyboard shortcuts">&#215;</button>
  </div>
  <div class="helpbody">
    <p>The presentation advances automatically with the narration. You can take control at any time.</p>
    <div class="shortcut-grid">
      <span>Play or pause</span><kbd>Space</kbd>
      <span>Previous or next step</span><kbd>&larr; &rarr;</kbd>
      <span>Previous or next slide</span><kbd>&uarr; &darr;</kbd>
      <span>Change playback speed</span><kbd>[ ]</kbd>
      <span>Show or hide slides</span><kbd>S</kbd>
      <span>Switch theme</span><kbd>T</kbd>
      <span>Enter full screen</span><kbd>F</kbd>
    </div>
  </div>
</dialog>

<div id="cover">
  <h1 id="covertitle"></h1>
  <p id="covermeta"></p>
  <button id="start">Play explainer</button>
</div>

<audio id="au"></audio>

<script>window.DECK = /*DECK*/null;</script>
<script>
const D = window.DECK;
if (!D || !Array.isArray(D.slides)) {
  document.title = 'Explainer template';
  document.getElementById('covertitle').textContent = 'This is the player template';
  document.getElementById('covermeta').textContent =
    'Build a deck.json and open the generated HTML presentation instead.';
  document.getElementById('start').disabled = true;
  throw new Error('player.html is a build template; no deck data was injected');
}
const S = D.slides, au = document.getElementById('au');
let si = 0, ti = 0, playing = false;

/* Display preferences survive reloads without becoming part of deck data. */
let theme = 'dark', tocHidden = false;
try {
  theme = localStorage.getItem('explain-theme')
    || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const savedToc = localStorage.getItem('explain-toc-hidden');
  tocHidden = savedToc === null ? matchMedia('(max-width: 760px)').matches : savedToc === 'true';
} catch (e) {}

function mermaidTheme(){
  if (!window.mermaid) return;
  const css = getComputedStyle(document.documentElement);
  mermaid.initialize({startOnLoad:false, theme:theme === 'dark' ? 'dark' : 'default',
    htmlLabels:false, flowchart:{htmlLabels:false, curve:'basis'},
    themeVariables:{background:css.getPropertyValue('--bg').trim(),
      primaryColor:css.getPropertyValue('--panel').trim(),
      primaryTextColor:css.getPropertyValue('--ink').trim(),
      primaryBorderColor:css.getPropertyValue('--line').trim(),
      lineColor:css.getPropertyValue('--dim').trim(), fontSize:'15px',
      edgeLabelBackground:css.getPropertyValue('--edge-bg').trim()}});
}

function setTheme(value, rerender){
  theme = value === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = theme;
  const btn = document.getElementById('themebtn');
  const next = theme === 'dark' ? 'light' : 'dark';
  btn.textContent = theme === 'dark' ? '\u2600' : '\u263e';
  btn.title = `switch to ${next} mode`;
  btn.setAttribute('aria-label', `switch to ${next} mode`);
  try { localStorage.setItem('explain-theme', theme); } catch (e) {}
  mermaidTheme();
  if (rerender && S[si].kind === 'mermaid') buildSlide(S[si]);
}

function setToc(hidden){
  tocHidden = hidden;
  document.getElementById('app').classList.toggle('toc-hidden', hidden);
  document.getElementById('tocbtn').setAttribute('aria-expanded', String(!hidden));
  document.getElementById('menubtn').setAttribute('aria-expanded', String(!hidden));
  try { localStorage.setItem('explain-toc-hidden', hidden); } catch (e) {}
}

function syncFullscreen(){
  const on = !!document.fullscreenElement;
  const btn = document.getElementById('fullscreenbtn');
  btn.title = on ? 'exit full screen' : 'enter full screen';
  btn.setAttribute('aria-label', btn.title);
  btn.setAttribute('aria-pressed', String(on));
}

async function toggleFullscreen(){
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (e) {}
}

function setHelp(open){
  const help = document.getElementById('help');
  if (open && !help.open) help.showModal();
  else if (!open && help.open) help.close();
}

/* Playback speed. Setting src resets playbackRate in some browsers, so the
   chosen rate is reapplied on every clip rather than set once. */
const RATES = [0.75, 1, 1.25, 1.5, 1.75, 2];
let rate = 1;
try { rate = Number(localStorage.getItem('explain-rate')) || 1; } catch (e) {}

function setRate(r){
  rate = r;
  au.playbackRate = r;
  document.getElementById('rate').textContent = r + '\u00d7';
  try { localStorage.setItem('explain-rate', r); } catch (e) {}
}

function bumpRate(dir){
  const i = RATES.indexOf(rate);
  setRate(RATES[Math.min(RATES.length - 1, Math.max(0, (i < 0 ? 1 : i) + dir))]);
}

/* Parse "1-8" or "3,7,10-12" into a Set of line numbers. Steps describe the
   lines they talk about the way a person would, not as an array of indices. */
function lineSet(spec){
  const out = new Set();
  String(spec).split(',').forEach(part => {
    const [a,b] = part.trim().split('-').map(Number);
    for (let i = a; i <= (b === undefined ? a : b); i++) out.add(i);
  });
  return out;
}

/* highlight.js emits spans that straddle newlines, so a naive split shatters
   them. Carry the open tags across each break instead. */
function splitHighlighted(html){
  const open = [], lines = [];
  for (const line of html.split('\n')){
    let s = open.join('') + line;
    const re = /<span [^>]*>|<\/span>/g;
    let m;
    while ((m = re.exec(line))) m[0] === '</span>' ? open.pop() : open.push(m[0]);
    lines.push(s + '</span>'.repeat(open.length));
  }
  return lines;
}

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function buildSlide(sl){
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  stage.scrollTop = 0;
  if (sl.title){
    const h = document.createElement('h2');
    h.className = 'title'; h.textContent = sl.title; stage.appendChild(h);
  }
  const sub = sl.file || sl.subtitle;
  if (sub){
    const p = document.createElement('p');
    p.className = 'subtitle'; p.textContent = sub; stage.appendChild(p);
  }

  if (sl.kind === 'bullets'){
    const ul = document.createElement('ul');
    ul.className = 'bullets';
    sl.bullets.forEach(b => { const li = document.createElement('li'); li.textContent = b; ul.appendChild(li); });
    stage.appendChild(ul);

  } else if (sl.kind === 'code' || sl.kind === 'tree'){
    const pre = document.createElement('pre');
    pre.className = 'code';
    const lang = sl.kind === 'tree' ? null : (sl.lang || null);
    let lines;
    if (lang && window.hljs && hljs.getLanguage(lang)){
      lines = splitHighlighted(hljs.highlight(sl.code, {language: lang}).value);
    } else {
      lines = sl.code.split('\n').map(esc);
    }
    pre.innerHTML = lines.map((h, i) =>
      `<div class="row"><span class="gut">${sl.kind === 'tree' ? '' : i + 1}</span><span class="src">${h || ' '}</span></div>`
    ).join('');
    stage.appendChild(pre);

  } else if (sl.kind === 'mermaid'){
    const wrap = document.createElement('div');
    wrap.className = 'mermaid-wrap';
    stage.appendChild(wrap);
    const id = 'mm' + si + '_' + Date.now();
    mermaid.render(id, sl.mermaid)
      .then(({svg}) => {
        wrap.innerHTML = svg;
        const el = wrap.querySelector('svg');
        if (el) el.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        applyStep();
      })
      .catch(e => {
        wrap.innerHTML = '<div class="mmerr">mermaid could not parse this diagram: '
          + esc(e && e.message ? e.message : String(e)) + '</div>'
          + '<pre class="code" style="padding:14px 16px">' + esc(sl.mermaid) + '</pre>';
      });

  } else if (sl.kind === 'image'){
    const box = document.createElement('div');
    box.className = 'shot';
    box.innerHTML = `<img src="${sl.src}" alt="">`;
    stage.appendChild(box);
  }
}

function applyStep(){
  const sl = S[si], step = sl.steps[ti], lit = step.lit;
  const stage = document.getElementById('stage');

  if (sl.kind === 'bullets'){
    const on = new Set(Array.isArray(lit) ? lit : lit === undefined ? [] : [lit]);
    const top = on.size ? Math.max(...on) : -1;
    stage.querySelectorAll('ul.bullets li').forEach((li, i) => {
      li.classList.toggle('on', on.has(i));
      li.classList.toggle('seen', !on.has(i) && i < top);
      li.style.visibility = i > top && on.size ? 'hidden' : 'visible';
    });

  } else if (sl.kind === 'code' || sl.kind === 'tree'){
    const on = lit === undefined ? null : lineSet(lit);
    const rows = stage.querySelectorAll('pre.code .row');
    rows.forEach((r, i) => r.classList.toggle('on', on === null || on.has(i + 1)));
    if (on){
      const first = [...rows].find(r => r.classList.contains('on'));
      if (first) first.scrollIntoView({block: 'nearest', behavior: 'smooth'});
    }

  } else if (sl.kind === 'mermaid'){
    const wrap = stage.querySelector('.mermaid-wrap');
    if (!wrap) return;
    const ids = Array.isArray(lit) ? lit : lit === undefined ? [] : [lit];
    wrap.classList.toggle('nolit', ids.length === 0);
    wrap.querySelectorAll('.node').forEach(n => {
      const label = (n.textContent || '').trim(), id = n.id || '';
      n.classList.toggle('on', ids.some(x =>
        id.split('-').includes(x) || label.includes(x)));
    });

  } else if (sl.kind === 'image'){
    stage.querySelectorAll('.spot').forEach(s => s.remove());
    if (Array.isArray(lit) && lit.length === 4){
      const box = stage.querySelector('.shot'), d = document.createElement('div');
      d.className = 'spot';
      d.style.cssText = `left:${lit[0]}%;top:${lit[1]}%;width:${lit[2]}%;height:${lit[3]}%`;
      box.appendChild(d);
    }
  }

  document.getElementById('say').innerHTML = '<b>' + esc(S[si].steps[ti].say) + '</b>';
  document.getElementById('pos').textContent =
    `slide ${si + 1}/${S.length}  ·  step ${ti + 1}/${S[si].steps.length}`;
  document.querySelectorAll('.toc-item').forEach((el, i) => el.classList.toggle('on', i === si));
}

function goto(newSi, newTi, autoplay){
  const slideChanged = newSi !== si || document.getElementById('stage').childElementCount === 0;
  si = newSi; ti = newTi;
  if (slideChanged) buildSlide(S[si]);
  applyStep();
  au.src = S[si].steps[ti].audio;
  au.playbackRate = rate;
  if (autoplay !== false) { au.play().catch(() => {}); playing = true; }
  syncBtn();
}

function next(){
  if (ti + 1 < S[si].steps.length) return goto(si, ti + 1);
  if (si + 1 < S.length) return goto(si + 1, 0);
  playing = false; syncBtn();
}
function prev(){
  if (ti > 0) return goto(si, ti - 1);
  if (si > 0) return goto(si - 1, S[si - 1].steps.length - 1);
}
function syncBtn(){
  const btn = document.querySelector('[data-act=play]');
  const active = playing && !au.paused;
  btn.textContent = active ? 'pause' : 'play';
  btn.setAttribute('aria-label', active ? 'pause narration' : 'play narration');
}

au.addEventListener('ended', next);
au.addEventListener('loadedmetadata', () => { au.playbackRate = rate; });
au.addEventListener('timeupdate', () => {
  if (au.duration) document.getElementById('fill').style.width = (au.currentTime / au.duration * 100) + '%';
});

document.addEventListener('click', e => {
  const control = e.target.closest('[data-act]');
  if (!control) return;
  const act = control.dataset.act;
  if (act === 'next') next();
  else if (act === 'prev') prev();
  else if (act === 'rate') setRate(RATES[(RATES.indexOf(rate) + 1) % RATES.length]);
  else if (act === 'toc') setToc(!tocHidden);
  else if (act === 'theme') setTheme(theme === 'dark' ? 'light' : 'dark', true);
  else if (act === 'fullscreen') toggleFullscreen();
  else if (act === 'help') setHelp(true);
  else if (act === 'close-help') setHelp(false);
  else if (act === 'play'){ au.paused ? au.play() : au.pause(); playing = !au.paused; syncBtn(); }
});

document.getElementById('help').addEventListener('click', e => {
  if (e.target === e.currentTarget) setHelp(false);
});

document.addEventListener('fullscreenchange', syncFullscreen);

document.addEventListener('keydown', e => {
  if (document.getElementById('help').open) return;
  if (document.getElementById('cover').classList.contains('gone') === false) return;
  const k = e.key;
  if (k === ' '){ e.preventDefault(); au.paused ? au.play() : au.pause(); playing = !au.paused; syncBtn(); }
  else if (k === 'ArrowRight') next();
  else if (k === 'ArrowLeft') prev();
  else if (k === 'ArrowDown' && si + 1 < S.length) goto(si + 1, 0);
  else if (k === 'ArrowUp' && si > 0) goto(si - 1, 0);
  else if (k === ']') bumpRate(1);
  else if (k === '[') bumpRate(-1);
  else if (k.toLowerCase() === 's') setToc(!tocHidden);
  else if (k.toLowerCase() === 't') setTheme(theme === 'dark' ? 'light' : 'dark', true);
  else if (k.toLowerCase() === 'f') toggleFullscreen();
  else if (k === '?') setHelp(true);
});

/* Build the sidebar and cover, then wait for the click Chrome requires before
   it will let a page play sound on its own. */
(function init(){
  document.title = D.title || 'Explainer';
  document.getElementById('covertitle').textContent = D.title || 'Explainer';
  const steps = S.reduce((n, s) => n + s.steps.length, 0);
  const secs = S.reduce((n, s) => n + s.steps.reduce((m, t) => m + (t.duration || 0), 0), 0);
  document.getElementById('covermeta').textContent =
    `${S.length} slides · ${steps} steps · ${Math.round(secs / 60)} min`;

  document.getElementById('toclist').innerHTML = S.map((s, i) =>
    `<button type="button" class="toc-item" data-i="${i}"><span class="n">${String(i + 1).padStart(2, '0')}</span>${esc(s.title || s.kind)}</button>`
  ).join('');
  document.getElementById('toclist').addEventListener('click', e => {
    const item = e.target.closest('.toc-item');
    if (item) goto(+item.dataset.i, 0);
  });

  setTheme(theme, false);
  setToc(tocHidden);
  syncFullscreen();

  setRate(RATES.includes(rate) ? rate : 1);

  document.getElementById('start').addEventListener('click', () => {
    document.getElementById('cover').classList.add('gone');
    goto(0, 0);
  });
})();
</script>
</body>
